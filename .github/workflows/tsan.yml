name: ThreadSanitizer

# A measuring tool, not a test that passes or fails: builds the host player
# of tests/build.sh with a sanitizer against the patched FFmpeg 9 of
# skyjet18/FFmpeg and runs the host tests that play through the whole player
# (several threads: the demux thread, the output buffering thread, the
# command loop) under it. Two jobs:
#   - TSan: ThreadSanitizer (-fsanitize=thread), every data race and lock
#     order report (halt_on_error=0, one log file per player process);
#   - leaks: AddressSanitizer with LeakSanitizer on (the ASan steps of
#     tests.yml run with detect_leaks=0): what a playback with segments,
#     switches, seeks, subtitles and the stop leaves unfreed at the exit().
# The job summaries list the unique reports / leak sites, the logs are
# attached to the run ("tsan-reports", "lsan-reports").
#
# FFmpeg itself is not instrumented: races inside FFmpeg are not seen, its
# locks and allocations are (the sanitizers intercept the pthread and malloc
# calls of the whole process).
#
# Only by hand (Actions -> ThreadSanitizer -> Run workflow), so it never
# makes the CI of a push or a pull request red. The tests themselves may
# fail under a sanitizer (it makes the player slower and some of them check
# timing); that does not fail the job either.

on:
  # a push to a branch of this name runs it too (a workflow that is only
  # on another branch than the default one cannot be started by hand)
  push:
    branches: [ci/tsan]
  workflow_dispatch:
    inputs:
      tests:
        description: 'Only these tests (integration, cover, chapters, first_keyframe, hls_switch-export, hls_switch-compressed, hls_switch-software, hls_switch-timing), comma separated. Empty = all.'
        default: ''

permissions:
  contents: read

concurrency:
  group: tsan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizer:
    name: ${{ matrix.title }}, FFmpeg 9
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: tsan
            title: TSan
          - san: lsan
            title: leaks
    env:
      SAN: ${{ matrix.san }}
      FFMPEG_REPO: skyjet18/FFmpeg
      FFMPEG_BRANCH: release/9.0-patched
      # the same build as the FFmpeg 9 job of tests.yml (same cache key)
      FFMPEG_CONFIGURE: --disable-autodetect --disable-doc --disable-ffplay --disable-debug --enable-libxml2 --enable-zlib --enable-openssl
      FFMPEG_EXTRA_LIBS: -lxml2 -lz -lssl -lcrypto
      FFMPEG_TEST_PROGRAMS: >-
        libavformat/tests/hls_http libavformat/tests/dash_http
        libavformat/tests/hls_selection libavformat/tests/dash_live libavformat/tests/mpegts_probe
      FFMPEG_SOURCE: /home/runner/ffmpeg-9/src
      FFMPEG_BUILD: /home/runner/ffmpeg-9/build
    steps:
    - name: Check out this repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Current commit of release/9.0-patched
      id: ffmpeg
      run: |
        sha=$(git ls-remote "https://github.com/$FFMPEG_REPO" "refs/heads/$FFMPEG_BRANCH" | cut -f1)
        if [ -z "$sha" ]; then
          echo "::error::branch $FFMPEG_BRANCH not found in $FFMPEG_REPO"
          exit 1
        fi
        sum=$(printf '%s\n' "$FFMPEG_CONFIGURE" "$FFMPEG_TEST_PROGRAMS" "$ImageOS" | sha256sum | cut -c1-16)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "key=ffmpeg-9-$sha-$sum" >> "$GITHUB_OUTPUT"

    - name: Install packages
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q build-essential pkg-config nasm libxml2-dev zlib1g-dev libssl-dev

    - name: FFmpeg from the cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /home/runner/ffmpeg-9
        key: ${{ steps.ffmpeg.outputs.key }}

    - name: Build FFmpeg
      if: steps.cache.outputs.cache-hit != 'true'
      env:
        SHA: ${{ steps.ffmpeg.outputs.sha }}
      run: |
        mkdir -p "$FFMPEG_SOURCE" "$FFMPEG_BUILD"
        curl --proto '=https' -sSL --retry 5 --retry-all-errors "https://github.com/$FFMPEG_REPO/archive/$SHA.tar.gz" -o "$RUNNER_TEMP/ffmpeg.tar.gz"
        tar -xzf "$RUNNER_TEMP/ffmpeg.tar.gz" --strip-components=1 -C "$FFMPEG_SOURCE"
        cd "$FFMPEG_BUILD"
        "$FFMPEG_SOURCE/configure" $FFMPEG_CONFIGURE
        make -j$(nproc)
        make -j$(nproc) $FFMPEG_TEST_PROGRAMS

    # The sanitizers of GCC 13 cannot map their shadow memory with the 32
    # bits of mmap randomisation of the runner kernel ("unexpected memory
    # mapping")
    - name: Address space for the sanitizer
      run: sudo sysctl -w vm.mmap_rnd_bits=28

    - name: Host tests under ${{ matrix.title }}
      env:
        TESTS: ${{ inputs.tests }}
      run: bash .github/tests/run-tsan-tests.sh . "$RUNNER_TEMP/san"

    - name: Unique reports
      if: ${{ !cancelled() }}
      run: |
        python3 .github/tests/${SAN}_report.py "$RUNNER_TEMP/san/reports" \
          --json "$RUNNER_TEMP/san/unique.json" > "$RUNNER_TEMP/san/unique.md"
        cat "$RUNNER_TEMP/san/unique.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.san }}-reports
        path: |
          ${{ runner.temp }}/san/reports
          ${{ runner.temp }}/san/logs
          ${{ runner.temp }}/san/unique.md
          ${{ runner.temp }}/san/unique.json
        if-no-files-found: ignore
        retention-days: 14
